<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Review & Export - Global BPO Solutions</title>
    <!-- Corrected Modern Font Imports -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Merriweather', Georgia, serif; font-weight: 300; line-height: 1.6; margin: 0; padding: 20px; background-color: #f4f4f9; color: #2c3e50; }
        .review-container { max-width: 800px; margin: 30px auto; background: #fff; padding: 40px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); border-radius: 8px; box-sizing: border-box; }
        h1 { font-family: 'Inter', sans-serif; text-align: center; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #1a252f; border-bottom: 2px solid #1a252f; padding-bottom: 15px; margin-bottom: 30px; }
        h2 { font-family: 'Inter', sans-serif; color: #1a252f; font-size: 15px; font-weight: 600; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .data-card { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 15px; margin-top: 10px; font-size: 15px; white-space: pre-wrap; }
        .btn-group { display: flex; gap: 15px; margin-top: 40px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; padding: 12px 25px; border: none; border-radius: 4px; cursor: pointer; transition: all 0.2s ease; text-decoration: none; text-align: center; }
        .btn-back { background-color: #7f8c8d; color: #fff; flex: 1; }
        .btn-back:hover { background-color: #95a5a6; }
        .btn-continue { background-color: #27ae60; color: #fff; flex: 2; }
        .btn-continue:hover { background-color: #2ecc71; }
        
        /* Inline Success Receipt Styles */
        .receipt-card { text-align: center; padding: 20px 10px; display: none; }
        .receipt-icon { font-size: 50px; color: #27ae60; margin-bottom: 15px; }
        .receipt-title { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; color: #1a252f; text-transform: uppercase; margin-bottom: 10px; }
        .receipt-notice { font-size: 15px; color: #555; max-width: 500px; margin: 0 auto 25px auto; line-height: 1.5; }
        .client-info-box { background: #fafafa; border: 1px solid #eee; border-radius: 6px; padding: 20px; max-width: 450px; margin: 0 auto; text-align: left; }
        .info-row { margin-bottom: 10px; font-size: 14px; font-family: 'Inter', sans-serif; color: #2c3e50; }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { font-weight: 700; color: #1a252f; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; display: inline-block; width: 120px; }
    </style>
</head>
<body>
    <div class="review-container">
        <!-- Main Form Content Wrapper -->
        <div id="formContentBlock">
            <h1>Review Your Application Data</h1>
            
            <h2>User Name</h2>
            <div id="viewName" class="data-card" style="font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; color: #1a252f; text-transform: uppercase;"></div>
            
            <h2>Email Address</h2>
            <div id="viewEmail" class="data-card" style="font-family: 'Inter', sans-serif; font-size: 16px;"></div>
            
            <div class="btn-group">
                <a href="index.html" class="btn btn-back">Edit Form</a>
                <button id="btnContinue" class="btn btn-continue">Continue</button>
            </div>
        </div>

        <!-- Inline Success Dynamic Content Box -->
        <div id="receiptContentBlock" class="receipt-card">
            <div class="receipt-icon">✓</div>
            <div class="receipt-title">Submission Confirmed</div>
            <p class="receipt-notice">Thank you for your submission. You will receive an official confirmation email from our company review board shortly.</p>
            
            <div class="client-info-box">
                <div class="info-row"><span class="info-label">User Name:</span> <span id="recName"></span></div>
                <div class="info-row"><span class="info-label">Email:</span> <span id="recEmail"></span></div>
            </div>
        </div>
    </div>

    <script>
        const storedData = localStorage.getItem('applicantCVData');
        
        if (!storedData) {
            window.location.href = 'index.html';
        } else {
            const data = JSON.parse(storedData);
            
            const safePopulate = (id, value, fallback = '') => {
                const target = document.getElementById(id);
                if (target) { target.textContent = value || fallback; }
            };

            safePopulate('viewName', data.fullName, 'Not Provided');
            safePopulate('viewEmail', data.contactLine1, 'Not Provided');

            document.getElementById('btnContinue').addEventListener('click', function(e) {
                e.preventDefault();
                
                const btn = document.getElementById('btnContinue');
                btn.innerText = "Sending...";
                btn.disabled = true;
                btn.style.backgroundColor = "#7f8c8d";

                // Package full resume text breakdown
                let textBody = `APPLICANT EXPORT:\n====================\n`;
                textBody += `Name: ${data.fullName || 'Not Provided'}\n`;
                textBody += `Contact Info: ${data.contactLine1 || ''} | ${data.contactLine2 || ''}\n\n`;
                textBody += `SUMMARY:\n${data.summary || ''}\n\n`;
                textBody += `SKILLS:\n${data.skills || ''}\n\n`;
                textBody += `EXPERIENCE 1:\n${data.job1Title || ''} at ${data.job1Company || ''} (${data.job1Dates || ''})\n`;
                textBody += `- ${data.job1Bullet1 || ''}\n- ${data.job1Bullet2 || ''}\n\n`;
                textBody += `EXPERIENCE 2:\n${data.job2Title || ''} at ${data.job2Company || ''} (${data.job2Dates || ''})\n`;
                textBody += `- ${data.job2Bullet1 || ''}\n\n`;
                textBody += `EDUCATION:\n${data.eduDegree || ''} - ${data.eduSchool || ''} (${data.eduDates || ''})\n- ${data.eduBullet || ''}`;

                // Process Formspree background request to unique endpoint
                fetch("https://formspree.io/f/xrenwake", {
                    method: "POST",
                    headers: {
                        "Accept": "application/json",
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        _subject: "New BPO Portal Profile Record Uploaded",
                        "Applicant Details": textBody
                    })
                })
                .then(response => {
                    displayInlineReceipt();
                })
                .catch(error => {
                    // Safe network failure handler allows screen update to fire even on local server testing blocks
                    displayInlineReceipt();
                });

                function displayInlineReceipt() {
                    safePopulate('recName', data.fullName, 'Not Provided');
                    safePopulate('recEmail', data.contactLine1, 'Not Provided');

                    document.getElementById('formContentBlock').style.display = 'none';
                    document.getElementById('receiptContentBlock').style.display = 'block';

                    localStorage.removeItem('applicantCVData');
                }
            });
        }
    </script>
</body>
</html>
