<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Submitted - Global BPO Solutions</title>
    <!-- Modern Font Imports -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { 
            font-family: 'Merriweather', Georgia, serif; 
            font-weight: 300; 
            line-height: 1.6; 
            margin: 0; 
            padding: 20px; 
            background-color: #f4f4f9; 
            color: #2c3e50; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
        .success-container { 
            max-width: 600px; 
            width: 100%;
            background: #fff; 
            padding: 50px 40px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); 
            border-radius: 8px; 
            box-sizing: border-box; 
            text-align: center;
        }
        .success-icon {
            font-size: 50px;
            color: #27ae60;
            margin-bottom: 20px;
        }
        h1 { 
            font-family: 'Inter', sans-serif; 
            font-size: 24px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #1a252f; 
            margin-bottom: 15px; 
        }
        p {
            font-size: 16px;
            color: #555;
            margin-bottom: 30px;
        }
        .btn-home { 
            display: inline-block;
            font-family: 'Inter', sans-serif; 
            font-size: 14px; 
            font-weight: 600; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            padding: 12px 30px; 
            background-color: #1a252f;
            color: #fff; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            text-decoration: none; 
        }
        .btn-home:hover { 
            background-color: #2c3e50; 
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="success-container">
        <!-- Visual Anchor Checkmark Icon -->
        <div class="success-icon">✓</div>
        <h1>Application Submitted Successfully</h1>
        <p>Thank you for your interest in joining Global BPO Solutions. Your application details and resume formatting profile have been securely transmitted to our recruitment queue for immediate review.</p>
        <a href="index.html" class="btn-home">Return to Homepage</a>
    </div>

    <script>
        // Clean up data tracking arrays out of local storage upon successful completion 
        localStorage.removeItem('applicantCVData');
    </script>
</body>
</html>
