<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walmart Inc - Professional CV Form</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Merriweather', Georgia, serif;
            font-weight: 300;
            line-height: 1.6;
            margin: 0;
            padding: 10px;
            background-color: #f4f4f9;
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            margin: 10px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            box-sizing: border-box;
        }
        .top-banner {
            font-family: 'Inter', sans-serif;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7f8c8d;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        header {
            text-align: center;
            border-bottom: 2px solid #1a252f;
            padding-bottom: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-image-container {
            margin-bottom: 15px;
            position: relative;
        }
        .profile-image-label {
            display: block;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px dashed #ccc;
            background: #fafafa;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .profile-image-label:hover {
            border-color: #1a252f;
            background: #f0f3f4;
        }
        .profile-image-label img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-image-placeholder {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            color: #7f8c8d;
            text-align: center;
        }
        .profile-image-text {
            font-size: 9px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #95a5a6;
        }
        input[type="file"] {
            display: none;
        }
        input[type="text"], textarea {
            width: 100%;
            border: 1px solid #ccc;
            background: #fafafa;
            font-family: inherit;
            color: inherit;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 4px;
            margin-bottom: 5px;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #1a252f;
            background: #fff;
            outline: none;
            box-shadow: 0 0 4px rgba(26, 37, 47, 0.2);
        }
        ::placeholder {
            color: #b0b0b0;
            font-weight: 300;
        }
        h1 input {
            font-family: 'Inter', sans-serif;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #1a252f;
        }
        .contact-info {
            width: 100%;
        }
        .contact-info input {
            font-family: 'Inter', sans-serif;
            text-align: center;
            font-size: 12px;
            color: #555;
            width: 100%;
            margin: 6px auto;
            display: block;
            letter-spacing: 0.5px;
        }
        h2 {
            font-family: 'Inter', sans-serif;
            color: #1a252f;
            font-size: 15px;
            font-weight: 600;
            border-bottom: 1px solid #ccc;
            padding-bottom: 5px;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        textarea {
            resize: vertical;
        }
        .grid-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 5px;
        }
        .grid-row input {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            color: #1a252f;
        }
        .sub-text input {
            font-style: italic;
            color: #7f8c8d;
            font-size: 13px;
        }
        ul {
            margin: 5px 0 0 0;
            padding-left: 15px;
        }
        li {
            margin-bottom: 10px;
            font-size: 13px;
        }
        li textarea {
            width: 100%;
        }
        footer {
            font-family: 'Inter', sans-serif;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            font-size: 11px;
            color: #7f8c8d;
            letter-spacing: 0.5px;
            line-height: 1.4;
        }
        .submit-btn-container {
            text-align: center;
            margin-top: 25px;
        }
        .submit-application-btn {
            font-family: 'Inter', sans-serif;
            background-color: #1a252f;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 0;
            width: 100%;
            max-width: 280px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .submit-application-btn:hover {
            background-color: #2c3e50;
        }

        @media (min-width: 600px) {
            body { padding: 20px; }
            .container { padding: 40px; margin: 30px auto; }
            .top-banner { font-size: 13px; letter-spacing: 2px; }
            h1 input { font-size: 26px; letter-spacing: 1.5px; }
            .contact-info input { width: 85%; }
            .grid-row { flex-direction: row; justify-content: space-between; gap: 15px; }
            .grid-row input:last-child { text-align: right; font-weight: 400; color: #555; }
            .submit-application-btn { padding: 12px 35px; width: auto; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="top-banner">Walmart Inc. Career Opportunity</div>
    <form id="cvForm">
        <header>
            <div class="profile-image-container">
                <label for="clientImageInput" class="profile-image-label" id="imageLabel">
                    <div class="profile-image-placeholder" id="imagePlaceholder">
                        📷<br><span class="profile-image-text">Add Photo</span>
                    </div>
                </label>
                <input type="file" id="clientImageInput" accept="image/*">
            </div>
            <h1><input type="text" id="fullName" placeholder="YOUR FULL NAME" required></h1>
            <div class="contact-info">
                <input type="text" id="contactLine1" placeholder="✉️ EMAIL ADDRESS" required>
                <input type="text" id="contactLine2" placeholder="📍 City, Country | 📞 Phone Number (with country code)" required>  
            </div>
        </header>
        <section>
            <h2>Professional Summary</h2>
            <textarea id="summary" rows="3" placeholder="Write a short summary..." required></textarea>
        </section>

        <section>
            <h2>Core Skills</h2>
            <textarea id="skills" rows="4" placeholder="• Professional Competencies..."></textarea>
        </section>

        <section>
            <h2>Professional Experience</h2>
            <!-- Job 1 -->
            <div class="job">
                <div class="grid-row">
                    <input type="text" id="job1Title" placeholder="Most Recent Job Title / Role" required>
                    <input type="text" id="job1Dates" placeholder="Month YYYY – Present" required>
                </div>
                <div class="sub-text">
                    <input type="text" id="job1Company" placeholder="Company Name, City, Country" required>
                </div>
                <ul>
                    <li><textarea id="job1Bullet1" rows="2" placeholder="Key Achievement 1..." required></textarea></li>
                    <li><textarea id="job1Bullet2" rows="2" placeholder="Key Achievement 2..." required></textarea></li>
                </ul>
            </div>

            <!-- Job 2 -->
            <div class="job" style="margin-top: 20px;">
                <div class="grid-row">
                    <input type="text" id="job2Title" placeholder="Previous Job Title / Role">
                    <input type="text" id="job2Dates" placeholder="Month YYYY – Month YYYY">
                </div>
                <div class="sub-text">
                    <input type="text" id="job2Company" placeholder="Company Name, City, Country">
                </div>
                <ul>
                    <li><textarea id="job2Bullet1" rows="2" placeholder="Describe your primary responsibility..."></textarea></li>
                </ul>
            </div>
        </section>

        <section>
            <h2>Education</h2>
            <div class="education-item">
                <div class="grid-row">
                    <input type="text" id="eduDegree" placeholder="Degree, Major..." required>
                    <input type="text" id="eduDates" placeholder="Graduation Year..." required>
                </div>
                <div class="sub-text">
                    <input type="text" id="eduSchool" placeholder="University..." required>
                </div>
                <ul>
                    <li><textarea id="eduBullet" rows="1" placeholder="Academic honors..."></textarea></li>
                </ul>
            </div>
        </section>

        <footer>
            I hereby certify that the information provided above is true, complete, and accurate.
        </footer>

        <div class="submit-btn-container">
            <button type="submit" class="submit-application-btn">Submit Application</button>
        </div>
    </form>
</div>

<script>
let base64ImageString = "";

// Universally responsive file expansion checker listener
document.getElementById('clientImageInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (file) {
        // Universal Name Check: Reads the letters at the end of the filename to avoid mobile browser errors
        const fileName = file.name.toLowerCase();
        const validExtensions = ['.jpg', '.jpeg', '.png', '.webp', '.gif'];
        const isValidExtension = validExtensions.some(ext => fileName.endsWith(ext));

        if (!isValidExtension) {
            alert("Invalid File Type! Please choose a valid image format (.jpg, .jpeg, .png, .webp).");
            event.target.value = "";
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const maxDimension = 400;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > maxDimension) {
                        height = Math.round((height * maxDimension) / width);
                        width = maxDimension;
                    }
                } else {
                    if (height > maxDimension) {
                        width = Math.round((width * maxDimension) / height);
                        height = maxDimension;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(img, 0, 0, width, height);

                // Compress data output to a tiny, fast-loading image string format
                base64ImageString = canvas.toDataURL('image/jpeg', 0.7);

                const label = document.getElementById('imageLabel');
                label.innerHTML = `<img src="${base64ImageString}" alt="Profile Preview" style="width: 100%; height: 100%; object-fit: cover;">`;
            };
        };
        reader.readAsDataURL(file);
    }
});

// Form submission handler
document.getElementById('cvForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const getValue = (id, fallback = '') => {
        const element = document.getElementById(id);
        return element ? element.value : fallback;
    };

    const cvData = {
        clientImage: base64ImageString,
        fullName: getValue('fullName'),
        contactLine1: getValue('contactLine1'),
        contactLine2: getValue('contactLine2'),
        summary: getValue('summary'),
        skills: getValue('skills'),
        
        job1Title: getValue('job1Title'),
        job1Dates: getValue('job1Dates'),
        job1Company: getValue('job1Company'),
        job1Bullet1: getValue('job1Bullet1'),
        job1Bullet2: getValue('job1Bullet2'),

        job2Title: getValue('job2Title', 'N/A'),
        job2Dates: getValue('job2Dates', 'N/A'),
        job2Company: getValue('job2Company', 'N/A'),
        job2Bullet1: getValue('job2Bullet1', 'N/A'),

        eduDegree: getValue('eduDegree'),
        eduDates: getValue('eduDates'),
        eduSchool: getValue('eduSchool'),
        eduBullet: getValue('eduBullet', 'N/A')
    };

    localStorage.setItem('applicantCVData', JSON.stringify(cvData));
    window.location.assign('input.html');
});
</script>
</body>
</html>
